name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli@7

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Add Android location permissions and launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = manifest.read_text()

          manifest_match = re.search(r'<manifest\b[^>]*>', text)

          if not manifest_match:
              raise SystemExit("The <manifest> tag was not found")

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          ]

          missing_permissions = [
              permission
              for permission in permissions
              if permission not in text
          ]

          if missing_permissions:
              addition = (
                  "\n"
                  + "\n".join(
                      "    " + permission
                      for permission in missing_permissions
                  )
                  + "\n"
              )

              position = manifest_match.end()

              text = (
                  text[:position]
                  + addition
                  + text[position:]
              )

          if 'android:icon="@drawable/wasselni_launcher"' not in text:
              if 'android:icon=' in text:
                  text = re.sub(
                      r'android:icon="[^"]+"',
                      'android:icon="@drawable/wasselni_launcher"',
                      text,
                      count=1
                  )
              else:
                  text = text.replace(
                      "<application",
                      '<application android:icon="@drawable/wasselni_launcher"',
                      1
                  )

          manifest.write_text(text)

          print("AndroidManifest updated successfully.")
          print(manifest.read_text())
          PY

          mkdir -p android/app/src/main/res/drawable

          cat > android/app/src/main/res/drawable/wasselni_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#0878DF"
                  android:pathData="M0,0h108v108h-108z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,10C37,10 24,23 24,40c0,21 30,49 30,49s30,-28 30,-49C84,23 71,10 54,10z" />

              <path
                  android:fillColor="#0878DF"
                  android:pathData="M54,22C44,22 36,30 36,40c0,10 8,18 18,18s18,-8 18,-18C72,30 64,22 54,22z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M39,43h30l4,14h-38z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M35,57h38v7h-38z" />

              <path
                  android:fillColor="#20A65A"
                  android:pathData="M0,86L35,66l73,20v22H0z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M0,82L38,63l70,20v5L38,70L0,88z" />

          </vector>
          XML

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create debug keystore
        run: |
          mkdir -p ~/.config/.android

          keytool -genkeypair -v \
            -keystore ~/.config/.android/debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Get SHA-1
        working-directory: android
        run: ./gradlew signingReport

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wasselni-monufia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
